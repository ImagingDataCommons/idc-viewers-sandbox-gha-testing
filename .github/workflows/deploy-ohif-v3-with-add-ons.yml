name: ohif/deploy-v3-with-add-ons

run-name: ohif/deploy-v3-with-add-ons (branch=${{ inputs.viewers_branch || vars.VIEWERS_BRANCH || 'master' }}, cs3d=${{ inputs.cs3d_version || vars.CS3D_VERSION || 'default' }})

on:
  workflow_dispatch:
    inputs:
      viewers_branch:
        description: 'ViewersV3 branch/tag/SHA (blank = repository variable VIEWERS_BRANCH, or master)'
        required: false
        type: string
      cs3d_version:
        description: 'Cornerstone3D version (blank = use version from repo, e.g., 3.0.0 or latest)'
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-ohif.yml
    with:
      viewers_repo: 'ImagingDataCommons/ViewersV3'
      viewers_branch: ${{ inputs.viewers_branch || vars.VIEWERS_BRANCH || 'master' }}
      cs3d_version: ${{ inputs.cs3d_version || vars.CS3D_VERSION || '' }}
      link_addons: true
    secrets: inherit
