name: _deploy-ohif

on:
  workflow_call:
    inputs:
      viewers_repo:
        description: 'Viewers repository (ImagingDataCommons/ViewersV3 or OHIF/Viewers)'
        required: true
        type: string
      viewers_branch:
        description: 'Branch/tag/SHA to deploy (empty = use default branch)'
        required: false
        type: string
        default: ''
      cs3d_version:
        description: 'Cornerstone3D version override (empty = use repo version, "latest" = npm latest, or specific version like "5.8.2")'
        required: false
        type: string
        default: ''
      link_addons:
        description: 'Link ohif-gcp-mode and ohif-gcp-extension'
        required: false
        type: boolean
        default: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show build configuration
        run: |
          echo "=========================================================="
          echo "  VIEWERS_REPO   : ${{ inputs.viewers_repo }}"
          echo "  VIEWERS_BRANCH : ${{ inputs.viewers_branch || '(default branch)' }}"
          echo "  CS3D_VERSION   : ${{ inputs.cs3d_version || '(from repo)' }}"
          echo "  LINK_ADDONS    : ${{ inputs.link_addons }}"
          echo "=========================================================="
          {
            echo "### Build configuration"
            echo ""
            echo "| Variable | Value |"
            echo "| --- | --- |"
            echo "| \`VIEWERS_REPO\` | \`${{ inputs.viewers_repo }}\` |"
            echo "| \`VIEWERS_BRANCH\` | \`${{ inputs.viewers_branch || '(default branch)' }}\` |"
            echo "| \`CS3D_VERSION\` | \`${{ inputs.cs3d_version || '(from repo)' }}\` |"
            echo "| \`LINK_ADDONS\` | \`${{ inputs.link_addons }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Clone Viewers repository
        run: git clone https://github.com/${{ inputs.viewers_repo }}.git Viewers

      - name: Checkout specified version
        if: inputs.viewers_branch != ''
        run: |
          cd Viewers
          git checkout "${{ inputs.viewers_branch }}"

      - name: Detect package manager
        id: detect-pm
        run: |
          cd Viewers
          if grep -q '"packageManager".*pnpm' package.json 2>/dev/null; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            PNPM_VERSION=$(grep -oP '"packageManager":\s*"pnpm@\K[^"]+' package.json || echo "11")
            echo "pnpm_version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"
            NODE_VERSION=$(grep -oP '"node":\s*">=\K[0-9]+' package.json || echo "24")
            echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
            echo "Detected: pnpm@$PNPM_VERSION, Node >= $NODE_VERSION"
          else
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "node_version=20" >> "$GITHUB_OUTPUT"
            echo "Detected: Yarn Classic, Node >= 20"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.detect-pm.outputs.node_version }}

      - name: Setup pnpm
        if: steps.detect-pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.detect-pm.outputs.pnpm_version }}

      - name: Resolve Cornerstone3D version
        id: resolve-cs3d
        if: inputs.cs3d_version != ''
        run: |
          INPUT_VER="${{ inputs.cs3d_version }}"
          INPUT_VER="${INPUT_VER#v}"

          echo "Resolving Cornerstone3D version from input: $INPUT_VER"

          if [ "$INPUT_VER" = "latest" ]; then
            echo "Querying npm for latest @cornerstonejs/core version..."
            RESOLVED=$(curl -s "https://registry.npmjs.org/@cornerstonejs/core" | jq -r '.["dist-tags"].latest')
          else
            echo "Checking if version $INPUT_VER exists on npm..."
            EXISTS=$(curl -s "https://registry.npmjs.org/@cornerstonejs/core/$INPUT_VER" | jq -r '.version // empty')
            if [ -n "$EXISTS" ]; then
              RESOLVED="$INPUT_VER"
            else
              echo "Version $INPUT_VER not found on npm, finding closest published version..."
              RESOLVED=$(curl -s "https://registry.npmjs.org/@cornerstonejs/core" | jq -r --arg v "$INPUT_VER" '
                .versions | keys | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) |
                map(select(. <= $v)) | sort_by(split(".") | map(tonumber)) | last // empty
              ')
              if [ -z "$RESOLVED" ]; then
                echo "::warning::No suitable version found, falling back to latest"
                RESOLVED=$(curl -s "https://registry.npmjs.org/@cornerstonejs/core" | jq -r '.["dist-tags"].latest')
              else
                echo "::notice::Version $INPUT_VER not published to npm, using closest available: $RESOLVED"
              fi
            fi
          fi

          echo "Resolved version: $RESOLVED"
          echo "version=$RESOLVED" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "| \`CS3D_RESOLVED\` | \`$RESOLVED\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin Cornerstone3D packages (Yarn)
        if: inputs.cs3d_version != '' && steps.detect-pm.outputs.manager == 'yarn'
        run: |
          cd Viewers
          VER="${{ steps.resolve-cs3d.outputs.version }}"
          echo "Pinning Cornerstone3D packages to $VER via Yarn resolutions..."
          node -e '
            const fs = require("fs"), path = require("path");
            const ver = process.argv[1];
            const names = new Set();
            const scan = d => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                if (!e.isDirectory()) continue;
                const p = path.join(d, e.name, "package.json");
                if (!fs.existsSync(p)) continue;
                const j = JSON.parse(fs.readFileSync(p, "utf8"));
                for (const dep of Object.keys({ ...j.dependencies, ...j.peerDependencies }))
                  if (dep.startsWith("@cornerstonejs/") && !dep.startsWith("@cornerstonejs/codec-"))
                    names.add(dep);
              }
            };
            for (const ws of ["platform", "extensions", "modes"]) if (fs.existsSync(ws)) scan(ws);
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            root.resolutions = root.resolutions || {};
            for (const n of names) root.resolutions[n] = ver;
            fs.writeFileSync("package.json", JSON.stringify(root, null, 2) + "\n");
            console.log("Pinned:", [...names].join(", "));
          ' "$VER"

      - name: Pin Cornerstone3D packages (pnpm)
        if: inputs.cs3d_version != '' && steps.detect-pm.outputs.manager == 'pnpm'
        run: |
          cd Viewers
          VER="${{ steps.resolve-cs3d.outputs.version }}"
          echo "Pinning Cornerstone3D packages to $VER via pnpm overrides..."
          node -e '
            const fs = require("fs"), path = require("path");
            const ver = process.argv[1];
            const names = new Set();
            const scan = d => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                if (!e.isDirectory()) continue;
                const p = path.join(d, e.name, "package.json");
                if (!fs.existsSync(p)) continue;
                const j = JSON.parse(fs.readFileSync(p, "utf8"));
                for (const dep of Object.keys({ ...j.dependencies, ...j.peerDependencies }))
                  if (dep.startsWith("@cornerstonejs/") && !dep.startsWith("@cornerstonejs/codec-"))
                    names.add(dep);
              }
            };
            for (const ws of ["platform", "extensions", "modes"]) if (fs.existsSync(ws)) scan(ws);
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            root.pnpm = root.pnpm || {};
            root.pnpm.overrides = root.pnpm.overrides || {};
            for (const n of names) root.pnpm.overrides[n] = ver;
            fs.writeFileSync("package.json", JSON.stringify(root, null, 2) + "\n");
            console.log("Pinned:", [...names].join(", "));
          ' "$VER"

      - name: Install OHIF dependencies (Yarn)
        if: steps.detect-pm.outputs.manager == 'yarn'
        run: |
          cd Viewers
          if [ -n "${{ inputs.cs3d_version }}" ]; then
            yarn install --no-frozen-lockfile
          else
            yarn install --frozen-lockfile
          fi

      - name: Install OHIF dependencies (pnpm)
        if: steps.detect-pm.outputs.manager == 'pnpm'
        run: |
          cd Viewers
          if [ -n "${{ inputs.cs3d_version }}" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Clone and install ohif-gcp-mode
        if: inputs.link_addons
        run: |
          git clone https://github.com/ImagingDataCommons/ohif-gcp-mode.git
          cd ohif-gcp-mode
          yarn install --frozen-lockfile

      - name: Clone and install ohif-gcp-extension
        if: inputs.link_addons
        run: |
          git clone https://github.com/ImagingDataCommons/ohif-gcp-extension.git
          cd ohif-gcp-extension
          yarn install --frozen-lockfile

      - name: Link add-ons (Yarn)
        if: inputs.link_addons && steps.detect-pm.outputs.manager == 'yarn'
        run: |
          cd Viewers
          yarn cli link-mode ../ohif-gcp-mode
          yarn cli link-extension ../ohif-gcp-extension

      - name: Link add-ons (pnpm)
        if: inputs.link_addons && steps.detect-pm.outputs.manager == 'pnpm'
        run: |
          cd Viewers
          pnpm cli link-mode ../ohif-gcp-mode
          pnpm cli link-extension ../ohif-gcp-extension

      - name: Download configuration files
        run: |
          cd Viewers
          wget -O ./firebase.json "${{ vars.OHIF_FIREBASE_JSON_URL }}"
          wget -O ./platform/app/public/config/test.js "${{ vars.OHIF_CONFIG_JS_URL }}"

      - name: Build OHIF (Yarn)
        if: steps.detect-pm.outputs.manager == 'yarn'
        run: |
          cd Viewers
          PUBLIC_URL=/ APP_CONFIG=config/test.js yarn build

      - name: Build OHIF (pnpm)
        if: steps.detect-pm.outputs.manager == 'pnpm'
        run: |
          cd Viewers
          PUBLIC_URL=/ APP_CONFIG=config/test.js pnpm build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 5d
          projectId: "${{ vars.FIREBASE_PROJECT_ID }}"
          entryPoint: ./Viewers
          channelId: live
