name: ohif/deploy-v3

run-name: ohif/deploy-v3 (branch=${{ inputs.viewers_branch || vars.VIEWERS_BRANCH || 'master' }}, cs3d=${{ inputs.cs3d_version || vars.CS3D_VERSION || 'default' }})

on:
  workflow_dispatch:
    inputs:
      viewers_branch:
        description: 'ViewersV3 branch/tag/SHA (blank = repository variable VIEWERS_BRANCH, or master)'
        required: false
        type: string
      cs3d_version:
        description: 'Cornerstone3D version (blank = use version from repo, e.g., 3.0.0 or latest)'
        required: false
        type: string

env:
  VIEWERS_BRANCH: ${{ inputs.viewers_branch || vars.VIEWERS_BRANCH || 'master' }}
  CS3D_VERSION: ${{ inputs.cs3d_version || vars.CS3D_VERSION || '' }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    container:
      image: node:20

    steps:
      - name: Show build configuration
        run: |
          echo "=========================================================="
          echo "  VIEWERS_BRANCH : $VIEWERS_BRANCH"
          echo "  CS3D_VERSION   : ${CS3D_VERSION:-'(from repo)'}"
          echo "=========================================================="
          {
            echo "### Build configuration"
            echo ""
            echo "| Variable | Value | Source |"
            echo "| --- | --- | --- |"
            echo "| \`VIEWERS_BRANCH\` | \`$VIEWERS_BRANCH\` | ${{ inputs.viewers_branch && 'workflow_dispatch input' || (vars.VIEWERS_BRANCH && 'repository variable' || 'default') }} |"
            echo "| \`CS3D_VERSION\` | \`${CS3D_VERSION:-'(from repo)'}\` | ${{ inputs.cs3d_version && 'workflow_dispatch input' || (vars.CS3D_VERSION && 'repository variable' || 'default') }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Clone and install OHIF dependencies
        run: |
          git clone --branch "$VIEWERS_BRANCH" https://github.com/ImagingDataCommons/ViewersV3.git
          cd ViewersV3
          if [ -n "$CS3D_VERSION" ]; then
            echo "Updating Cornerstone3D packages to version $CS3D_VERSION..."
            yarn up "@cornerstonejs/*@$CS3D_VERSION"
            yarn install --no-frozen-lockfile
          else
            yarn install --frozen-lockfile
          fi

      - name: Build OHIF
        run: |
          cd ViewersV3
          wget -O ./firebase.json "${{ vars.OHIF_FIREBASE_JSON_URL }}"
          wget -O ./platform/app/public/config/test.js "${{ vars.OHIF_CONFIG_JS_URL }}"
          PUBLIC_URL=/ APP_CONFIG=config/test.js yarn build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 5d
          projectId: "${{ vars.FIREBASE_PROJECT_ID }}"
          entryPoint: ./ViewersV3
          channelId: live 
          # channelId: # 'pr-${{ github.event.number }}-${{ github.event.pull_request.head.ref }}'