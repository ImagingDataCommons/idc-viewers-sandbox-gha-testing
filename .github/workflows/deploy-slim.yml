name: slim/deploy

run-name: slim/deploy (slim=${{ inputs.slim_branch || vars.SLIM_BRANCH || 'master' }})

on:
  workflow_dispatch:
    inputs:
      slim_branch:
        description: 'Slim branch or tag (blank = repository variable SLIM_BRANCH, or master)'
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-slim.yml
    with:
      slim_branch: ${{ inputs.slim_branch || vars.SLIM_BRANCH || 'master' }}
    secrets: inherit
