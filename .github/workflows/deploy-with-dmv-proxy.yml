name: slim/deploy-with-dmv-proxy

run-name: slim/deploy-with-dmv-proxy (slim=${{ inputs.slim_branch || vars.SLIM_BRANCH || 'master' }}, dmv=${{ inputs.dmv_branch || vars.DMV_BRANCH || 'master' }})

on:
  workflow_dispatch:
    inputs:
      slim_branch:
        description: 'Slim branch or tag (blank = repository variable SLIM_BRANCH, or master)'
        required: false
        type: string
      dmv_branch:
        description: 'dicom-microscopy-viewer branch or tag (blank = repository variable DMV_BRANCH, or master)'
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-slim.yml
    with:
      slim_branch: ${{ inputs.slim_branch || vars.SLIM_BRANCH || 'master' }}
      dmv_branch: ${{ inputs.dmv_branch || vars.DMV_BRANCH || 'master' }}
      config_url_var: 'SLIM_PROXY_CONFIG_JS_URL'
    secrets: inherit
