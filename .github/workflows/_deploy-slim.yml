name: _deploy-slim

on:
  workflow_call:
    inputs:
      slim_branch:
        description: 'Slim branch or tag to deploy'
        required: true
        type: string
      dmv_branch:
        description: 'dicom-microscopy-viewer branch or tag (empty = do not link DMV)'
        required: false
        type: string
        default: ''
      config_url_var:
        description: 'Variable name for config JS URL (SLIM_CONFIG_JS_URL or SLIM_PROXY_CONFIG_JS_URL)'
        required: false
        type: string
        default: 'SLIM_CONFIG_JS_URL'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    container:
      image: node:20

    steps:
      - name: Show build configuration
        run: |
          echo "=========================================================="
          echo "  SLIM_BRANCH : ${{ inputs.slim_branch }}"
          if [ -n "${{ inputs.dmv_branch }}" ]; then
            echo "  DMV_BRANCH  : ${{ inputs.dmv_branch }}"
          fi
          echo "=========================================================="
          {
            echo "### Build configuration"
            echo ""
            echo "| Variable | Value |"
            echo "| --- | --- |"
            echo "| \`SLIM_BRANCH\` | \`${{ inputs.slim_branch }}\` |"
            if [ -n "${{ inputs.dmv_branch }}" ]; then
              echo "| \`DMV_BRANCH\` | \`${{ inputs.dmv_branch }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.1

      - name: Clone and install SLIM dependencies
        run: |
          git clone --branch "${{ inputs.slim_branch }}" https://github.com/ImagingDataCommons/slim.git
          cd slim
          pnpm install --frozen-lockfile

      - name: Clone, install, and build dicom-microscopy-viewer
        if: inputs.dmv_branch != ''
        run: |
          git clone --branch "${{ inputs.dmv_branch }}" https://github.com/ImagingDataCommons/dicom-microscopy-viewer.git
          cd dicom-microscopy-viewer
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Link dicom-microscopy-viewer
        if: inputs.dmv_branch != ''
        run: |
          cd slim
          pnpm link ../dicom-microscopy-viewer
          pnpm install --no-frozen-lockfile

      - name: Build slim
        run: |
          cd slim
          wget -O ./firebase.json "${{ vars.SLIM_FIREBASE_JSON_URL }}"
          CONFIG_URL="${{ inputs.config_url_var == 'SLIM_PROXY_CONFIG_JS_URL' && vars.SLIM_PROXY_CONFIG_JS_URL || vars.SLIM_CONFIG_JS_URL }}"
          wget -O ./public/config/test.js "$CONFIG_URL"
          REACT_APP_CONFIG=test PUBLIC_URL=/ pnpm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SLIM }}"
          expires: 5d
          projectId: "${{ vars.FIREBASE_PROJECT_ID_SLIM }}"
          entryPoint: ./slim
          channelId: live
