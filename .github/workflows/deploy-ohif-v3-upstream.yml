name: ohif/deploy-v3-upstream

run-name: ohif/deploy-v3-upstream (ohif=${{ inputs.ohif_version || vars.OHIF_VERSION_TAG || 'default' }}, cs3d=${{ inputs.cs3d_version || vars.CS3D_VERSION || 'default' }})

on:
  workflow_dispatch:
    inputs:
      ohif_version:
        description: 'OHIF version/tag/SHA (blank = repository variable OHIF_VERSION_TAG, or default branch)'
        required: false
        type: string
      cs3d_version:
        description: 'Cornerstone3D version (blank = use version from OHIF repo, e.g., 3.0.0 or latest)'
        required: false
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-ohif.yml
    with:
      viewers_repo: 'OHIF/Viewers'
      viewers_branch: ${{ inputs.ohif_version || vars.OHIF_VERSION_TAG || '' }}
      cs3d_version: ${{ inputs.cs3d_version || vars.CS3D_VERSION || '' }}
    secrets: inherit
